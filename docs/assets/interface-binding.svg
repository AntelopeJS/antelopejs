<svg xmlns="http://www.w3.org/2000/svg" width="400" height="710" viewBox="0 0 400 710" role="img" aria-labelledby="title desc">
  <title id="title">A contract separates the caller from the provider choice</title>
  <desc id="desc">Application configuration selects a provider. At runtime the consumer calls its interface instance, which forwards to that provider. A different provider requires compatible behavior and configuration, not a different consumer import.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#52667a" stroke-width="1.5"/></marker></defs>
  <rect width="400" height="710" rx="16" fill="#f5f8fb"/>
  <g font-family="system-ui, sans-serif" fill="#172b40">
    <text x="24" y="36" font-size="23" font-weight="700">One import.</text>
    <text x="24" y="66" font-size="20">An application-selected provider.</text>
    <rect x="24" y="100" width="352" height="90" rx="8" fill="#fff" stroke="#b4c2cf"/>
    <text x="200" y="135" text-anchor="middle" font-size="23" font-weight="700">Consumer module</text>
    <text x="200" y="166" text-anchor="middle" font-size="20">calls SendEmail(message)</text>
    <path d="M200 190 V222" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="230" width="352" height="90" rx="8" fill="#e1f4ee" stroke="#73ac99"/>
    <text x="200" y="265" text-anchor="middle" font-size="23" font-weight="700">Interface instance</text>
    <text x="200" y="296" text-anchor="middle" font-size="20">typed contract + proxies</text>
    <path d="M200 320 V352" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="360" width="352" height="90" rx="8" fill="#fff" stroke="#b4c2cf"/>
    <text x="200" y="395" text-anchor="middle" font-size="23" font-weight="700">Provider module</text>
    <text x="200" y="426" text-anchor="middle" font-size="20">implements email delivery</text>
    <path d="M200 520 V460" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="216" y="490" font-size="20">selects</text>
    <rect x="24" y="520" width="352" height="90" rx="8" fill="#e9edf7" stroke="#b2bed8"/>
    <text x="200" y="555" text-anchor="middle" font-size="23" font-weight="700">Application configuration</text>
    <text x="200" y="586" text-anchor="middle" font-size="20">chooses the module and settings</text>
    <text x="24" y="650" font-size="20">The consumer imports the contract,</text>
    <text x="24" y="680" font-size="20">not the provider.</text>
  </g>
</svg>
