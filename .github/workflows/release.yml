name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm distribution channel
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      release-version:
        description: Exact stable version; empty uses the automatic increment
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: AntelopeJS/.github/.github/workflows/release-npm-public.yml@v1
    with:
      channel: ${{ inputs.channel }}
      release-version: ${{ inputs.release-version }}
    secrets:
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
